name: Обновить новости популярных стран

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prefetch
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Собрать новости
        run: node scripts/prefetch.mjs
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: 3
      - uses: actions/upload-artifact@v4
        with:
          name: data-${{ matrix.shard }}
          path: data/
          retention-days: 1

  save:
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: data-*
          path: data
          merge-multiple: true
      - name: Сохранить
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Обновить новости $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
