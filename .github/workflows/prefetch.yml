name: Обновить новости стран

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  models: read

concurrency:
  group: prefetch
  cancel-in-progress: false

jobs:
  prefetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Собрать новости
        run: node scripts/prefetch.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Сохранить
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          # Put fresh files on top of the latest main, so parallel commits never conflict
          cp -r data "$RUNNER_TEMP/fresh"
          for i in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            mkdir -p data && cp "$RUNNER_TEMP"/fresh/*.json data/
            git add data
            git diff --cached --quiet && exit 0
            git commit -q -m "Обновить новости $(date -u +'%Y-%m-%d %H:%M')"
            git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
