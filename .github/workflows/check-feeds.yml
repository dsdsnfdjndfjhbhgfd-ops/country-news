name: Проверить источники

# Checks that every outlet's feed answers, is fresh and in the right language (scripts/check-feeds.mjs).
# Run by hand from the Actions tab, or automatically when the list of outlets changes on a work branch.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["scripts/sources.mjs", "scripts/feeds.mjs", "scripts/check-feeds.mjs"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Проверить ленты изданий
        run: node scripts/check-feeds.mjs
