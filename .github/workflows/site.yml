name: Сайт и новости

# Every 15 minutes: collect news, keep only the latest copy of the data in the "data" branch
# (overwritten each time, no history), then publish the site with that data to GitHub Pages.
# A push to main republishes the site with the current data, without collecting.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write   # overwrite the data branch
  pages: write      # publish the site
  id-token: write   # required by GitHub Pages deployments

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Взять последние данные
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch -q --depth 1 origin data
            rm -rf data && mkdir data
            git --work-tree=data checkout FETCH_HEAD -- .
            git reset -q
            echo "Данные взяты из ветки data"
          else
            echo "Ветки data ещё нет: начинаем с данных из main"
          fi

      - uses: actions/setup-node@v4
        if: github.event_name != 'push'
        with:
          node-version: 20

      - name: Собрать новости
        if: github.event_name != 'push'
        run: node scripts/prefetch.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}       # key of the AI service (secret)
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}        # optional: service address
          LLM_MODEL: ${{ vars.LLM_MODEL }}              # optional: model id(s)
          # More AI services: one secret each (a secret that does not exist is simply empty)
          LLM_KEY_GROQ: ${{ secrets.LLM_KEY_GROQ }}
          LLM_KEY_CEREBRAS: ${{ secrets.LLM_KEY_CEREBRAS }}
          LLM_KEY_MISTRAL: ${{ secrets.LLM_KEY_MISTRAL }}
          LLM_KEY_DEEPSEEK: ${{ secrets.LLM_KEY_DEEPSEEK }}
          LLM_KEY_OPENROUTER: ${{ secrets.LLM_KEY_OPENROUTER }}
          LLM_KEY_TOGETHER: ${{ secrets.LLM_KEY_TOGETHER }}
          LLM_KEY_SAMBANOVA: ${{ secrets.LLM_KEY_SAMBANOVA }}
          LLM_KEY_NVIDIA: ${{ secrets.LLM_KEY_NVIDIA }}
          LLM_KEY_OPENAI: ${{ secrets.LLM_KEY_OPENAI }}
          LLM_KEY_GEMINI: ${{ secrets.LLM_KEY_GEMINI }}
          LLM_KEY_EXTRA1: ${{ secrets.LLM_KEY_EXTRA1 }}   # any other service: also add the variable LLM_BASE_EXTRA1
          LLM_BASE_EXTRA1: ${{ vars.LLM_BASE_EXTRA1 }}
          LLM_MODEL_EXTRA1: ${{ vars.LLM_MODEL_EXTRA1 }}
          # EXTRA1 per collection: up to RUNS requests of BATCH events, PARALLEL at a time, at most every GAP minutes
          LLM_BATCH_EXTRA1: ${{ vars.LLM_BATCH_EXTRA1 || '10' }}
          LLM_RUNS_EXTRA1: ${{ vars.LLM_RUNS_EXTRA1 || '24' }}
          LLM_PARALLEL_EXTRA1: ${{ vars.LLM_PARALLEL_EXTRA1 || '6' }}
          LLM_GAP_EXTRA1: ${{ vars.LLM_GAP_EXTRA1 || '1' }}   # requests go out only when events lack a summary
          LLM_MAX_TOKENS: ${{ vars.LLM_MAX_TOKENS }}        # optional: answer length limit (default 30000)

      - name: Перезаписать ветку data
        if: github.event_name != 'push'
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd data
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Новости на $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
          rm -rf .git

      - name: Подготовить сайт
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          cp -r index.html news.html account.html article.html ratings.html assets data "$RUNNER_TEMP/site/"
          rm -rf "$RUNNER_TEMP/site/data/full"   # the collector's working copies are not needed by the site
          touch "$RUNNER_TEMP/site/.nojekyll"
          # Stamp scripts and styles with the version, so browsers fetch new code right after an update
          cd "$RUNNER_TEMP/site"
          sed -i -E "s#(src|href)=\"(assets/[^\"?]+\.(js|css))\"#\1=\"\2?v=${GITHUB_SHA::8}\"#g" *.html
          grep -ho 'assets/[^"]*?v=[0-9a-f]*' *.html | sort -u | head -20

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      - id: deploy
        uses: actions/deploy-pages@v4
