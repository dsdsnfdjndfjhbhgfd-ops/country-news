<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ev.news · кабинет</title>
<script>try{var t=localStorage.getItem("cn:theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700;800&family=Literata:opsz,wght@7..72,500;7..72,700&display=swap">
<link rel="stylesheet" href="assets/account.css">
<style>
/* Layout: one column. Account header, then "my countries" chips, then saved news. */
:root{
  --bg:#edf0f5; --surface:#ffffff; --ink:#172033; --muted:#5b667a; --line:#d3d9e3;
  --accent:#2b50e8; --meter-off:#d9dee8;
  --t-politics:#2b50e8; --t-economy:#0b7a5a; --t-security:#c0362c;
  --sans:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Literata",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151f; --surface:#171e2b; --ink:#e7ebf2; --muted:#94a0b4; --line:#273145;
  --accent:#8ea6ff; --meter-off:#2a3346;
  --t-politics:#8ea6ff; --t-economy:#4fd1a5; --t-security:#ff8a7a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151f; --surface:#171e2b; --ink:#e7ebf2; --muted:#94a0b4; --line:#273145;
  --accent:#8ea6ff; --meter-off:#2a3346;
  --t-politics:#8ea6ff; --t-economy:#4fd1a5; --t-security:#ff8a7a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.55;padding-inline:20px;padding-block:20px 72px;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:40px}
a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-weight:800;font-size:22px;text-decoration:none;letter-spacing:-.02em}
.brand span{color:var(--accent)}
.nav{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.nav a{font-weight:500;text-decoration:none;color:var(--muted)}
.nav a:hover{color:var(--accent)}
h1{margin:0;font-weight:800;font-size:clamp(32px,5vw,48px);letter-spacing:-.025em}
.who{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.who p{margin:4px 0 0;color:var(--muted)}
.btn{font:700 15px var(--sans);border-radius:999px;padding:10px 18px;cursor:pointer;border:2px solid var(--line);background:transparent;color:var(--ink);text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.primary:hover{background:var(--accent);border-color:var(--accent);color:#fff}
section h2{margin:0 0 4px;font-size:24px;font-weight:800}
section > p{margin:0 0 16px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{font:500 15px var(--sans);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer}
.chips button:hover{border-color:var(--accent)}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.list{list-style:none;margin:0;padding:0;border-top:2px solid var(--ink)}
.list li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;padding:16px 0;border-bottom:1px solid var(--line);align-items:start}
.list a.t{font-family:var(--serif);font-weight:700;font-size:18px;line-height:1.35;text-decoration:none}
.list a.t:hover{color:var(--accent);text-decoration:underline}
.list .meta{font-size:14px;color:var(--muted);margin-top:4px}
.list .why{font-size:15px;margin:6px 0 0;color:var(--ink)}
.empty{padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:14px;color:var(--muted)}
.card{padding:24px;background:var(--surface);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;gap:12px;max-width:440px}
.card label{font-weight:700;font-size:14px}
.card input{font:500 16px var(--sans);color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:11px 12px}
.card input:focus{outline:none;border-color:var(--accent)}
.msg{margin:0;font-size:14px}
.msg.err{color:var(--t-security)} .msg.ok{color:var(--t-economy)}
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <a class="brand" href="./">ev<span>.news</span></a>
    <nav class="nav"><a href="./">Главная</a><a href="news.html">Лента</a><span data-account></span></nav>
  </header>

  <main id="main"><p class="msg">Загружаю…</p></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/account.js"></script>
<script>
const COUNTRIES = [["RU", "Россия"], ["US", "США"], ["CN", "Китай"], ["UA", "Украина"], ["IL", "Израиль"], ["IR", "Иран"], ["DE", "Германия"], ["GB", "Великобритания"], ["FR", "Франция"], ["TR", "Турция"]];
const NAME = Object.fromEntries(COUNTRIES);
const main = document.getElementById("main");
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function fmt(ts) { return ts ? new Date(ts).toLocaleString("ru-RU", { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" }) : ""; }

function render() {
  main.textContent = "";
  if (!Account.available) { main.append(el("div", "empty", "Вход сейчас недоступен: не загрузился модуль входа. Обновите страницу.")); return; }
  if (Account.recovery && Account.user) return renderNewPassword();
  if (!Account.user) return renderSignedOut();

  const who = el("div", "who");
  const left = el("div"); left.append(el("h1", null, "Кабинет"), el("p", null, Account.user.email));
  const out = el("button", "btn", "Выйти"); out.type = "button";
  out.onclick = async () => { await Account.signOut(); };
  who.append(left, out);
  main.append(who);

  const mine = el("section");
  mine.append(el("h2", null, "Мои страны"), el("p", null, "Эти страны стоят первыми на главной и в ленте, а лента открывается на первой из них."));
  const chips = el("div", "chips");
  const picked = Account.countries;
  for (const [code, name] of COUNTRIES) {
    const b = el("button", null, (picked.includes(code) ? "★ " : "") + name); b.type = "button";
    b.setAttribute("aria-pressed", String(picked.includes(code)));
    b.onclick = async () => { b.disabled = true; await Account.toggleCountry(code); };
    chips.append(b);
  }
  mine.append(chips);
  main.append(mine);

  const sv = el("section");
  const items = Account.savedList();
  sv.append(el("h2", null, `Сохранённые новости${items.length ? " · " + items.length : ""}`), el("p", null, "Сохраняйте события кнопкой «Сохранить» в ленте. Здесь они остаются, даже когда пропадают из ленты."));
  if (!items.length) {
    const e = el("div", "empty"); e.append("Пока ничего не сохранено. "); const a = el("a", null, "Открыть ленту"); a.href = "news.html"; e.append(a); sv.append(e);
  } else {
    const ul = el("ul", "list");
    for (const it of items) {
      const li = el("li"); const body = el("div");
      const a = el("a", "t", it.title); a.href = it.url; a.target = "_blank"; a.rel = "noopener";
      body.append(a, el("div", "meta", [NAME[it.country] || it.country, it.topic, it.source, fmt(it.published_at)].filter(Boolean).join(", ")));
      if (it.why) body.append(el("p", "why", it.why));
      const rm = el("button", "btn", "Убрать"); rm.type = "button";
      rm.onclick = async () => { rm.disabled = true; try { await Account.toggleSaved(it); } catch (e) { rm.disabled = false; alertMsg(e.message); } };
      li.append(body, rm); ul.append(li);
    }
    sv.append(ul);
  }
  main.append(sv);

  const pw = el("section");
  pw.append(el("h2", null, "Пароль"));
  const ch = el("button", "btn", "Сменить пароль"); ch.type = "button";
  ch.onclick = () => renderNewPassword(true);
  pw.append(ch);
  main.append(pw);
}

function alertMsg(text) { const m = el("p", "msg err", text); main.prepend(m); setTimeout(() => m.remove(), 6000); }

function renderSignedOut() {
  const g = el("div", "gate");
  g.append(el("h2", null, "Войдите в ev.news"), el("p", null, "Аккаунт открывает ленту новостей, позволяет выбрать свои страны и сохранять важные события. Настройки сохраняются на всех ваших устройствах."));
  const row = el("div", "row");
  const a = el("button", null, "Войти"); a.type = "button"; a.onclick = () => Account.openDialog("signin");
  const b = el("button", "alt", "Зарегистрироваться"); b.type = "button"; b.onclick = () => Account.openDialog("signup");
  row.append(a, b); g.append(row); main.append(g);
}

function renderNewPassword(fromCabinet) {
  main.textContent = "";
  const f = el("form", "card");
  f.append(el("h1", null, "Новый пароль"));
  const lab = el("label", null, "Новый пароль, не короче 6 символов"); lab.htmlFor = "np";
  const inp = el("input"); inp.type = "password"; inp.id = "np"; inp.autocomplete = "new-password"; inp.minLength = 6;
  const msg = el("p", "msg");
  const btn = el("button", "btn primary", "Сохранить пароль"); btn.type = "submit";
  f.append(lab, inp, msg, btn);
  if (fromCabinet) { const c = el("button", "btn", "Отмена"); c.type = "button"; c.onclick = render; f.append(c); }
  f.addEventListener("submit", async e => {
    e.preventDefault();
    if (inp.value.length < 6) { msg.textContent = "Пароль должен быть не короче 6 символов."; msg.className = "msg err"; return; }
    btn.disabled = true;
    try { await Account.updatePassword(inp.value); msg.textContent = "Пароль изменён."; msg.className = "msg ok"; setTimeout(render, 1200); }
    catch (err) { msg.textContent = err.message; msg.className = "msg err"; btn.disabled = false; }
  });
  main.append(f); inp.focus();
}

Account.ready.then(render);
Account.onChange(e => { if (e !== "TOKEN_REFRESHED") render(); });
</script>
</body>
</html>
